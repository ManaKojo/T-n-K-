<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Biên Niên Sử Vùng Tro Tàn — Text RPG Roguelike</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0f0f13; --panel:#17171e; --text:#e6e6e9; --muted:#a9a9b2; --accent:#6ee7b7; --danger:#ef4444; --warn:#f59e0b; --link:#93c5fd; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial; background: radial-gradient(1200px 500px at 10% 10%, #15151b, var(--bg)); color:var(--text); line-height:1.6; }
    header { padding:16px; background: linear-gradient(90deg,#111,#15151b); border-bottom:1px solid #222532; }
    header h1 { margin:0; font-size:20px; letter-spacing:0.5px; }
    header small { color:var(--muted); }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns: 1fr 360px; gap:16px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .panel { background:var(--panel); border:1px solid #222532; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
    .left,.right { padding:14px; }
    .log { height:50vh; overflow:auto; padding-right:6px; border-bottom: 1px solid #232533; margin-bottom: 10px; }
    .log p { margin:6px 0; border-left: 2px solid transparent; padding-left: 8px; }
    .log .sys { color:var(--muted); font-style: italic; }
    .log .good { color:var(--accent); border-left-color: var(--accent); }
    .log .bad { color:var(--danger); border-left-color: var(--danger); }
    .log .warn { color:var(--warn); border-left-color: var(--warn); }
    .actions { display:grid; grid-template-columns: repeat(2,1fr); gap:8px; margin-top:10px; }
    button { background:#1f1f27; border:1px solid #2a2a36; color:var(--text); padding:10px 12px; border-radius:8px; cursor:pointer; transition: 0.2s; }
    button:hover { background:#2a2a36; border-color:#3a3a48; }
    .primary { background:#23302b; border-color:#2f4b3f; color:#ccefe0; }
    .danger { background:#2c1f21; border-color:#542b32; color:#ffd6da; }
    .divider { border-top:1px solid #232533; margin:12px 0; }
    .statgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:14px; margin-top:6px; }
    .tag { display:inline-block; padding:2px 8px; border:1px solid #2a2a36; border-radius:999px; font-size:12px; color:var(--muted); margin-right:6px; margin-bottom: 4px; }
    .fear { color:#fca5a5; }
    .quest { border:1px dashed #3a3a48; border-radius:8px; padding:10px; background: #1a1a24; }
    footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>

<header>
  <h1>Biên Niên Sử Vùng Tro Tàn <small>— RPG Narrative Roguelike</small></h1>
</header>

<main>
  <section class="panel left">
    <div id="intro"></div>
    <div class="log" id="log"></div>
    <div id="actions" class="actions"></div>
  </section>

  <aside class="panel right">
    <div id="char"></div>
    <div class="divider"></div>
    <div id="status"></div>
    <div class="divider"></div>
    <div id="inventory"></div>
    <div class="divider"></div>
    <div id="questPanel"></div>
    <div class="divider"></div>
    <div id="historyPanel"></div>
  </aside>
</main>

<footer>
  Dữ liệu thế giới được lưu trữ theo Seed trong trình duyệt của bạn.
</footer>

<script>
/* ==== Hệ thống Xử lý Ngẫu nhiên (RNG) ==== */
function makeRNG(seedStr){
    let h = 1779033703 ^ seedStr.length;
    for(let i = 0; i < seedStr.length; i++) {
        h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
    }
    let a = h >>> 0;
    return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
}
function choice(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }
function roll(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }

/* ==== Dữ liệu Game ==== */
const DIA_DIEM=["Emberford","Gloomfen","Sable Ridge","Ashen Spire","Whisper Marsh","Sunless Bazaar","Hollowgate","Mistral Keep"];
const QUAI=["Wraith","Bandit","Bog Serpent","Bone Stalker","Wild Ghoul","Hexed Wolf"];
const VAT_PHAM=["Lương khô","Thuốc bổ","Bom khói","Kìm mở khóa","Bản đồ cũ","Đồng bạc","Mảnh di vật"];
const MUC_TIEU=[
  {id:"mt_relic", text:"Tìm lại một di vật bị thất lạc", type:"relic"},
  {id:"mt_hunt", text:"Săn một hung thú được đánh dấu", type:"hunt"}
];

const ORIGINS=[
  (p,y,l,o)=>`${p} là kẻ sống sót cuối cùng sau đại họa năm ${y-5}. Bạn đến ${l} với hy vọng ${o.toLowerCase()}.`,
  (p,y,l,o)=>`Từng là một học giả, ${p} đã đánh đổi tất cả để giải mã bí mật tại ${l}. Mục tiêu của bạn: ${o.toLowerCase()}.`
];

/* ==== Quản lý Trạng thái (State) ==== */
let State = {
    seed: null, rng: null, 
    player: { name: "", hp: 10, maxHp: 10, fear: 10, inventory: [], trauma: "Bóng ma" },
    location: "", year: 120,
    quest: null, inCombat: false, combatCtx: null
};

/* ==== Logic chính ==== */
function initGame() {
    const savedSeed = localStorage.getItem("rl_seed") || Math.random().toString(36).substring(7);
    localStorage.setItem("rl_seed", savedSeed);
    State.seed = savedSeed;
    State.rng = makeRNG(savedSeed);
    
    State.player.name = "Kẻ Lữ Hành";
    State.player.inventory = ["Lương khô", "Đồng bạc"];
    State.location = choice(State.rng, DIA_DIEM);
    State.objective = choice(State.rng, MUC_TIEU);
    
    log("Chào mừng đến với vùng Tro Tàn.", "sys");
    renderAll();
    returnToHub();
}

function log(txt, cls) {
    const p = document.createElement("p");
    p.textContent = `> ${txt}`;
    if(cls) p.className = cls;
    const logEl = document.getElementById("log");
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
}

function renderAll() {
    const p = State.player;
    // Intro
    document.getElementById("intro").innerHTML = `<p>${choice(State.rng, ORIGINS)(p.name, State.year, State.location, State.objective.text)}</p>`;
    // Stats
    document.getElementById("char").innerHTML = `
        <h3>${p.name}</h3>
        <div class="statgrid">
            <div>HP: ${p.hp}/${p.maxHp}</div>
            <div class="fear">Sợ hãi: ${p.fear}%</div>
        </div>
        <div class="small">Vị trí: ${State.location} | Năm: ${State.year}</div>
    `;
    // Inventory
    const invHTML = p.inventory.map((item, i) => `<div>• ${item} <button onclick="useItem(${i})">Dùng</button></div>`).join("");
    document.getElementById("inventory").innerHTML = `<h3>Túi đồ</h3>${invHTML || "Trống"}`;
}

function returnToHub() {
    State.inCombat = false;
    renderAll();
    setActions([
        { label: "Khám phá", class: "primary", onClick: explore },
        { label: "Di chuyển", onClick: travel },
        { label: "Nghỉ ngơi", onClick: rest }
    ]);
}

function setActions(btns) {
    const container = document.getElementById("actions");
    container.innerHTML = "";
    btns.forEach(b => {
        const btn = document.createElement("button");
        btn.textContent = b.label;
        if(b.class) btn.className = b.class;
        btn.onclick = b.onClick;
        container.appendChild(btn);
    });
}

/* ==== Hành động ==== */
function explore() {
    const eventRoll = Math.random();
    if(eventRoll > 0.6) {
        const monster = choice(State.rng, QUAI);
        startCombat(monster);
    } else {
        const item = choice(State.rng, VAT_PHAM);
        State.player.inventory.push(item);
        log(`Bạn tìm thấy: ${item}`, "good");
        returnToHub();
    }
}

function travel() {
    State.location = choice(State.rng, DIA_DIEM);
    State.year += roll(State.rng, 1, 3);
    log(`Bạn đã đi tới ${State.location}.`, "sys");
    returnToHub();
}

function rest() {
    if(State.player.hp < State.player.maxHp) {
        State.player.hp = Math.min(State.player.maxHp, State.player.hp + 2);
        State.player.fear = Math.max(0, State.player.fear - 10);
        log("Bạn nghỉ ngơi một chút. HP và tinh thần được hồi phục.", "good");
    } else {
        log("Bạn không thấy mệt.");
    }
    returnToHub();
}

function useItem(index) {
    const item = State.player.inventory[index];
    if(item === "Thuốc bổ" || item === "Lương khô") {
        State.player.hp = Math.min(State.player.maxHp, State.player.hp + 3);
        log(`Bạn dùng ${item}, hồi máu.`, "good");
        State.player.inventory.splice(index, 1);
    } else {
        log(`Bạn không biết dùng ${item} như thế nào lúc này.`);
    }
    renderAll();
}

/* ==== Chiến đấu (Combat) ==== */
function startCombat(enemyName) {
    State.inCombat = true;
    State.combatCtx = { name: enemyName, hp: 5 };
    log(`Một con ${enemyName} xuất hiện!`, "bad");
    renderCombat();
}

function renderCombat() {
    setActions([
        { label: "Tấn công", class: "danger", onClick: attack },
        { label: "Bỏ chạy", onClick: () => { 
            if(Math.random() > 0.5) { log("Bạn đã chạy thoát!"); returnToHub(); }
            else { log("Chạy không thoát!", "bad"); enemyTurn(); }
        }}
    ]);
}

function attack() {
    const dmg = roll(State.rng, 1, 3);
    State.combatCtx.hp -= dmg;
    log(`Bạn gây ${dmg} sát thương lên ${State.combatCtx.name}.`);
    if(State.combatCtx.hp <= 0) {
        log(`Bạn đã hạ gục ${State.combatCtx.name}!`, "good");
        returnToHub();
    } else {
        enemyTurn();
    }
}

function enemyTurn() {
    const dmg = 1;
    State.player.hp -= dmg;
    log(`${State.combatCtx.name} tấn công bạn, gây ${dmg} sát thương!`, "bad");
    if(State.player.hp <= 0) {
        log("BẠN ĐÃ TỬ TRẬN. Thế giới vẫn tiếp tục trôi qua...", "bad");
        setActions([{ label: "Hồi sinh (New Game)", onClick: () => location.reload() }]);
    } else {
        renderAll();
        renderCombat();
    }
}

// Khởi chạy game
window.onload = initGame;

</script>
</body>
</html>
