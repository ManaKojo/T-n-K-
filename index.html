<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chronicles of Ashen Realms — Text RPG Roguelike</title>
  <style>
    body { font-family:sans-serif; background:#111; color:#eee; margin:0; }
    header { background:#222; padding:10px; }
    h1 { margin:0; font-size:20px; }
    main { display:flex; }
    .left { flex:2; padding:10px; }
    .right { flex:1; padding:10px; background:#1a1a1a; }
    .log { height:300px; overflow:auto; border:1px solid #333; padding:5px; margin-bottom:10px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    button { padding:8px; background:#333; color:#eee; border:none; cursor:pointer; }
    button.primary { background:#2a4; }
    button.danger { background:#a22; }
  </style>
</head>
<body>
<header><h1>Chronicles of Ashen Realms</h1></header>
<main>
  <div class="left">
    <div id="intro"></div>
    <div class="log" id="log"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="right">
    <div id="char"></div>
    <div id="inventory"></div>
    <div id="questPanel"></div>
    <div id="npcPanel"></div>
    <div id="historyPanel"></div>
  </div>
</main>

<script>
/* ==== State ==== */
const State={player:null,hp:10,maxHp:10,inventory:["Ration","Tonic"],inCombat:false,combatEnemy:null,history:{deaths:[],events:[],legends:[]}};

/* ==== UI helpers ==== */
function log(msg,cls=""){const el=document.getElementById("log");const p=document.createElement("p");p.textContent=msg;if(cls)p.className=cls;el.appendChild(p);el.scrollTop=el.scrollHeight;}
function setActions(btns){const root=document.getElementById("actions");root.innerHTML="";btns.forEach(b=>{const btn=document.createElement("button");btn.textContent=b.label;if(b.class)btn.classList.add(b.class);btn.onclick=b.onClick;root.appendChild(btn);});}

/* ==== Renderers ==== */
function renderIntro(){document.getElementById("intro").innerHTML=`<p>Bạn là ${State.player}. HP: ${State.hp}/${State.maxHp}</p>`;}
function renderChar(){document.getElementById("char").innerHTML=`<h3>Nhân vật</h3><p>${State.player}</p><p>HP: ${State.hp}/${State.maxHp}</p>`;}
function renderInv(){document.getElementById("inventory").innerHTML=`<h3>Túi đồ</h3>${State.inventory.map((i,idx)=>`<div>${i} <button onclick="useItem(${idx})">Use</button></div>`).join("")}`;}
function renderQuest(){document.getElementById("questPanel").innerHTML=`<h3>Nhiệm vụ</h3><p>${State.quest?State.quest.title:"Chưa có"}</p>`;}
function renderNPC(){document.getElementById("npcPanel").innerHTML=`<h3>NPC</h3><p>${State.npc?State.npc.name:"Chưa gặp"}</p>`;}
function renderHistory(){
  const h=State.history||{deaths:[],events:[],legends:[]};
  const deaths=(h.deaths||[]).slice(-5).map(d=>`${d.location} (${d.year})`).join("; ");
  const events=(h.events||[]).slice(-5).map(e=>`${e.type} (${e.year})`).join("; ");
  const legends=(h.legends||[]).slice(-5).map(l=>`${l.name} (${l.year})`).join("; ");
  document.getElementById("historyPanel").innerHTML=`<h3>Lịch sử</h3><p>Tử vong: ${deaths||"—"}</p><p>Sự kiện: ${events||"—"}</p><p>Huyền thoại: ${legends||"—"}</p>`;
}
function renderPanels(){renderIntro();renderChar();renderInv();renderQuest();renderNPC();renderHistory();}

/* ==== Hub ==== */
function returnToHub(){
  renderPanels();
  setActions([
    {label:"Khảo sát",class:"primary",onClick:explore},
    {label:"Tìm NPC",onClick:meetNPC},
    {label:"Di chuyển",onClick:travel},
    {label:"Mở túi đồ",onClick:()=>{renderInv();log("Bạn mở túi đồ.");setActions([{label:"Trở về",onClick:returnToHub}]);}}
  ]);
}

/* ==== Actions ==== */
function explore(){log("Bạn khảo sát khu vực...");setActions([{label:"Trở về",onClick:returnToHub}]);}
function meetNPC(){State.npc={name:"Aeris Dawnfall"};log("Bạn gặp NPC: Aeris Dawnfall.");renderNPC();setActions([{label:"Trở về",onClick:returnToHub}]);}
function travel(){log("Bạn di chuyển tới vùng đất khác.");setActions([{label:"Trở về",onClick:returnToHub}]);}
function useItem(idx){
  const item=State.inventory[idx];
  if(item==="Ration"){State.hp=Math.min(State.maxHp,State.hp+2);log("Bạn ăn Ration, hồi 2 HP.");}
  if(item==="Tonic"){State.hp=Math.min(State.maxHp,State.hp+3);log("Bạn uống Tonic, hồi 3 HP.");}
  State.inventory.splice(idx,1);
  renderInv();renderChar();
  State.inCombat?returnToCombat():returnToHub();
}

/* ==== Combat ==== */
function startCombat(enemy){State.inCombat=true;State.combatEnemy={name:enemy,hp:5};log(`Chiến đấu với ${enemy}!`);returnToCombat();}
function returnToCombat(){
  renderPanels();
  setActions([
    {label:"Tấn công",class:"primary",onClick:attack},
    {label:"Dùng vật phẩm",onClick:()=>{renderInv();setActions([{label:"Trở lại giao tranh",onClick:returnToCombat}]);}},
    {label:"Phòng thủ",onClick:defend},
    {label:"Tháo chạy",class:"danger",onClick:flee}
  ]);
}
function attack(){State.combatEnemy.hp-=2;log(`Bạn đánh ${State.combatEnemy.name}, còn ${State.combatEnemy.hp} HP.`);if(State.combatEnemy.hp<=0){log("Bạn thắng!");State.inCombat=false;returnToHub();}else{enemyTurn();}}
function defend(){log("Bạn thủ thế.");enemyTurn(true);}
function flee(){log("Bạn tháo chạy!");State.inCombat=false;returnToHub();}
function enemyTurn(defending=false){const dmg=defending?1:2;State.hp-=dmg;log(`${State.combatEnemy.name} tấn công, bạn mất ${dmg} HP.`);renderChar();if(State.hp<=0){log("Bạn đã tử nạn.");State.inCombat=false;setActions([{label:"Chơi lại",class:"primary",onClick:boot}]);}else{returnToCombat();}}

/* ==== Boot ==== */
function boot(){State.player="Nhân vật";State.hp=10;State.maxHp=10;State.inventory=["Ration","Tonic"];State.quest=null;State.npc=null;State.history={deaths:[],events:[],legends:[]};document.getElementById("log").innerHTML="";log("Khởi đầu hành trình...");returnToHub();}
boot();
</script>
</body>
</html>
